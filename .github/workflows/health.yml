name: Health

# Polls the live site every 30 minutes (a private repository on the free GitHub plan has 2,000 Actions minutes a month and each run is rounded
# up to a whole minute: every 15 minutes would use about 2,900 and stop the checks, and the CI, part-way through the month). A run that fails is an alert: GitHub emails the people watching this repository about failed
# workflow runs, and the Actions tab lists the history. Set the repository variable HEALTH_URL to check another address
# (Settings > Secrets and variables > Actions > Variables). GitHub pauses scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Address to check instead of the usual one. A wrong address makes the run fail, which is how to test that the alert reaches you."
        required: false

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the live site (database, AI, budget)
        env:
          URL: ${{ inputs.url || vars.HEALTH_URL || 'https://understand-io.vercel.app' }}
        run: |
          code=000
          for i in 1 2 3; do
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 20 "$URL/api/health?strict=1" || true)
            [ "$code" = "200" ] && break
            sleep 20
          done
          cat health.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::The health check of $URL answered $code (503 means the database is down, or the AI is failing or paused by its budget; see the reasons in the body)."
            exit 1
          fi
