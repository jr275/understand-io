name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no database and no secret.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Built with recognisable stand-in values in every secret variable, so the next step can prove none of them is written into what the browser is served.
      - name: Build, with stand-in secrets in the environment
        run: pnpm build
        env:
          TOGETHER_API_KEY: SENTINEL-TOGETHER-ci-7f3a91c2d4e8
          GOOGLE_CLIENT_ID: SENTINEL-GOOGLE-ID-ci-7f3a91c2d4e8
          GOOGLE_CLIENT_SECRET: SENTINEL-GOOGLE-SECRET-ci-7f3a91c2d4e8
          GLOSS_COOKIE_SECRET: SENTINEL-COOKIE-SECRET-ci-7f3a91c2d4e8-0000
          DATABASE_URL: postgres://ci:SENTINELDBPASSWORD7f3a91c2@localhost:5432/not-used
      - name: No secret in what the browser is served
        run: node scripts/scan-bundle.mjs
        env:
          TOGETHER_API_KEY: SENTINEL-TOGETHER-ci-7f3a91c2d4e8
          GOOGLE_CLIENT_ID: SENTINEL-GOOGLE-ID-ci-7f3a91c2d4e8
          GOOGLE_CLIENT_SECRET: SENTINEL-GOOGLE-SECRET-ci-7f3a91c2d4e8
          GLOSS_COOKIE_SECRET: SENTINEL-COOKIE-SECRET-ci-7f3a91c2d4e8-0000
          DATABASE_URL: postgres://ci:SENTINELDBPASSWORD7f3a91c2@localhost:5432/not-used

  # Ownership, migrations and transactions against a real PostgreSQL (docs/quality/integration-testing.md).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gloss_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gloss_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations to the empty database
        run: pnpm db:migrate
      - run: pnpm build
      - name: Start the production server on the database
        run: |
          echo "GLOSS_COOKIE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          set -a; . "$GITHUB_ENV"; set +a
          nohup pnpm start --port 3201 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3201/api/documents > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: psql is available (the database role tests run the real setup script with it and must not be skipped)
        run: psql --version
      - name: Unit tests that need a real database (skipped when DATABASE_URL is unset)
        run: pnpm test tests/unit/accountMerge.test.ts tests/unit/importErrors.test.ts tests/unit/rateLimitShared.test.ts tests/unit/aiStoreDatabase.test.ts tests/unit/analyticsDatabase.test.ts tests/unit/analyticsCapDatabase.test.ts tests/unit/dbRolesDatabase.test.ts tests/unit/rehearsalDatabase.test.ts
      # rehearsalDatabase.test.ts creates and drops its own databases (gloss_rh_*) on this disposable service, and dbRolesDatabase.test.ts its own databases (gloss_roles_*) and roles (rt_*); analyticsDatabase.test.ts removes the rows it adds.
      - name: The disposable service was left clean
        run: |
          node --input-type=module <<'EOF'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { max: 1, prepare: false });
          const [{ n: databases }] = await sql`SELECT count(*)::int AS n FROM pg_database WHERE starts_with(datname, 'gloss_rh_')`;
          const [{ n: rows }] = await sql`SELECT count(*)::int AS n FROM public.analytics_events`;
          const [{ n: roleDatabases }] = await sql`SELECT count(*)::int AS n FROM pg_database WHERE starts_with(datname, 'gloss_roles_')`;
          const [{ n: roles }] = await sql`SELECT count(*)::int AS n FROM pg_roles WHERE starts_with(rolname, 'rt_')`;
          await sql.end();
          console.log(`rehearsal databases left: ${databases}; analytics rows left: ${rows}; role-test databases left: ${roleDatabases}; role-test roles left: ${roles}`);
          if (databases !== 0 || rows !== 0 || roleDatabases !== 0 || roles !== 0) process.exit(1);
          EOF
      # Includes the allowances test, which starts its own production servers (ports 3311 to 3315) and a stand-in AI provider.
      - name: Integration tests
        run: INTEGRATION_BASE_URL=http://localhost:3201 pnpm test:integration
      - name: Server log on failure
        if: failure()
        run: cat server.log

  # Kept apart so a newly published advisory shows up on its own and does not hide the other results.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
