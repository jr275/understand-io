<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keeple</title>
    <style>
      body { margin: 0; padding: 14px; width: 260px; font: 14px/1.4 system-ui, sans-serif; color: #151412; background: #f6f3ec; }
      h1 { margin: 0 0 10px; font: 500 20px/1 Georgia, serif; }
      button { display: block; width: 100%; margin-top: 8px; padding: 10px 12px; border: 1px solid #d8d2c6; border-radius: 12px; background: #fff; font: inherit; text-align: left; cursor: pointer; }
      button:first-of-type { background: #151412; border-color: #151412; color: #f6f3ec; }
      p { margin: 10px 0 0; font-size: 12px; color: #7a756c; }
    </style>
  </head>
  <body>
    <h1>Keeple</h1>
    <button id="read" type="button">Read this page in Keeple</button>
    <button id="save" type="button">Save this page to Keeple</button>
    <p>The page is sent only when you press a button.</p>
    <script src="popup.js"></script>
  </body>
</html>
